<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>बार्षिक समिक्षा प्रतिवेदन - आ.व. ०८२/०८३</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --navy:#1b1b52; --navy2:#2b2b74; --green:#1e5b45; --green2:#22795b;
  --red:#b01e39; --ink:#16162e; --muted:#5b5b74; --line:#d8d8e4;
  --bg:#eef0f6; --paper:#ffffff;
  --c0:#2f6bff; --c1:#ec4899; --c2:#38bdf8; --c3:#a855f7; --c4:#f59e0b; --c5:#10b981;
  --stageW:1280px; --stageH:720px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Mukta","Noto Sans Devanagari",system-ui,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#f7f8fc,#e7e9f2);
  color:var(--ink); overflow:hidden;
}
button{font-family:inherit}

/* ---------- Toolbar ---------- */
#toolbar{
  position:fixed; top:0; left:0; right:0; height:52px; z-index:50;
  display:flex; align-items:center; gap:8px; padding:0 14px;
  background:rgba(20,20,46,.92); backdrop-filter:blur(8px);
  color:#fff; box-shadow:0 2px 18px rgba(0,0,0,.25);
}
#toolbar .brand{font-weight:800; letter-spacing:.3px; font-size:15px; margin-right:6px; white-space:nowrap}
#toolbar .brand small{opacity:.7; font-weight:500}
.tb-spacer{flex:1}
.tb-btn{
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff;
  padding:7px 11px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600;
  display:inline-flex; align-items:center; gap:6px; transition:.15s;
}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn.active{background:#3ad29f; color:#04231a; border-color:#3ad29f}
/* Save-to-DB button */
.tb-save{background:#3ad29f; color:#04231a; border-color:#3ad29f; font-weight:700}
.tb-save:hover{background:#2fbf8e}
.tb-save.saving{opacity:.7; cursor:progress}
.tb-save.unsaved{background:#f7b32b; color:#3a2600; border-color:#f7b32b; animation:savePulse 1.6s ease-in-out infinite}
.tb-save.unsaved:hover{background:#e6a41c}
@keyframes savePulse{0%,100%{box-shadow:0 0 0 0 rgba(247,179,43,.55)}50%{box-shadow:0 0 0 5px rgba(247,179,43,0)}}
.tb-group{display:flex; gap:6px; align-items:center}
.tb-sep{width:1px; height:26px; background:rgba(255,255,255,.15); margin:0 4px}

/* ---------- Stage ---------- */
#stageWrap{
  position:fixed; top:52px; left:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
#stage{
  width:var(--stageW); height:var(--stageH); position:relative;
  transform-origin:center center;
}
.slide{
  position:absolute; inset:0; width:var(--stageW); height:var(--stageH);
  background:var(--paper); border-radius:14px; overflow:hidden;
  box-shadow:0 30px 70px rgba(20,20,60,.28); opacity:0; pointer-events:none;
  display:flex; flex-direction:column;
  transform:scale(.985); transition:opacity .45s ease, transform .45s ease;
}
.slide.active{opacity:1; transform:scale(1); pointer-events:auto}

/* decorative header/footer common to content slides */
.deco-corner{position:absolute; top:0; right:0; width:230px; height:118px;
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  clip-path:polygon(28% 0,100% 0,100% 100%,60% 100%); z-index:1}
.deco-corner:after{content:""; position:absolute; top:0; right:0; width:230px; height:118px;
  background:#fff; clip-path:polygon(30% 0,38% 0,10% 100%,2% 100%); opacity:.9}
.slide-head{position:relative; z-index:2; padding:26px 54px 0 54px}
.office-tag{color:var(--red); font-weight:700; font-size:19px}
.slide-title{color:var(--navy); font-weight:800; font-size:40px; line-height:1.15; margin:6px 0 0}
.slide-title .sub{display:block; color:var(--green); font-size:22px; font-weight:600; margin-top:2px}
.slide-body{position:relative; z-index:2; flex:1; padding:22px 54px 40px; min-height:0}
.slide-foot{position:absolute; left:0; bottom:0; height:40px; width:100%;
  display:flex; align-items:center; z-index:2}
.slide-foot .bar{width:150px; height:100%; background:linear-gradient(90deg,var(--navy),var(--navy2));
  clip-path:polygon(0 0,100% 0,80% 100%,0 100%)}
.slide-foot .fname{color:var(--muted); font-size:12.5px; padding-left:14px}
.slide-foot .pnum{margin-left:auto; padding-right:20px; color:var(--navy); font-weight:700; font-size:13px}

/* ---------- Title slide ---------- */
.title-slide{background:linear-gradient(180deg,#ffffff,#f4f6ff)}
.title-slide .chevrons{position:absolute; top:0; right:0; bottom:0; width:46%;
  background:linear-gradient(135deg,#12123a,var(--navy2)); z-index:1;
  clip-path:polygon(28% 0,100% 0,100% 100%,10% 100%)}
.title-slide .chevrons:before{content:""; position:absolute; inset:0; z-index:2;
  background:repeating-linear-gradient(135deg,transparent 0 46px,rgba(255,255,255,.06) 46px 52px)}
.title-inner{position:relative; z-index:3; padding:64px 60px; max-width:66%; height:100%;
  display:flex; flex-direction:column; justify-content:center; gap:6px}
.crest{height:80px; width:80px; object-fit:contain; margin-bottom:10px;
  display:block}
.crest-fallback{width:78px; height:78px; border-radius:50%; background:#fff; margin-bottom:10px;
  display:flex; align-items:center; justify-content:center; font-size:34px}
.t-prov{color:var(--red); font-weight:800; font-size:26px}
.t-min{color:var(--red); font-weight:600; font-size:18px; line-height:1.3}
.t-office{color:var(--navy); font-weight:800; font-size:21px; margin-top:4px}
.t-main{color:var(--navy); font-weight:800; font-size:58px; line-height:1.08; margin-top:22px}
.t-fy{display:inline-block; margin-top:20px; background:var(--red); color:#fff;
  font-weight:700; font-size:20px; padding:9px 20px; border-radius:8px; width:max-content}

/* ---------- Intro paragraphs ---------- */
.intro-wrap{display:grid; grid-template-columns:1fr 320px; gap:30px; height:100%}
.intro-text p{font-size:22px; line-height:1.6; margin:0 0 18px; text-align:justify; color:#20223f}
.intro-photo{border-radius:12px; background:
  linear-gradient(135deg,#243b6b,#3a5aa0); position:relative; overflow:hidden;
  display:flex; align-items:flex-end; color:#fff}
.intro-photo-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0}
.intro-photo span{position:relative; z-index:1; padding:14px; font-weight:700; font-size:14px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55)); width:100%}

/* ---------- List slide ---------- */
.list-grid{display:grid; gap:16px 34px; align-content:start; height:100%}
.list-grid.cols-2{grid-template-columns:1fr 1fr}
.list-item{display:flex; gap:14px; align-items:flex-start}
.badge{flex:0 0 auto; width:42px; height:42px; border-radius:50%;
  background:linear-gradient(160deg,var(--navy),var(--navy2)); color:#fff;
  font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(27,27,82,.35)}
.list-item .txt{font-size:20px; line-height:1.4; padding-top:6px; font-weight:600; color:#23233f}
.list-grid.big .list-item .txt{font-size:22px}

/* ---------- Tables ---------- */
.tbl-cap{display:inline-block; background:var(--green); color:#fff; font-weight:700;
  font-size:19px; padding:9px 20px; border-radius:8px; margin-bottom:14px}
table.data{border-collapse:collapse; width:100%; font-size:16px; background:#fff}
table.data th, table.data td{border:1px solid #cfd2e0; padding:8px 12px; text-align:center}
table.data thead th{background:var(--green); color:#fff; font-weight:700}
table.data thead th.g2{background:var(--navy)}
table.data tbody td:first-child{font-weight:600; text-align:left; background:#f4f6fb}
table.data tbody tr:nth-child(even) td{background:#f8f9fd}
table.data tbody tr:nth-child(even) td:first-child{background:#eef1f8}
table.data tr.total td{background:var(--navy)!important; color:#fff; font-weight:800}
table.data.compact{font-size:14px}
table.data.compact th, table.data.compact td{padding:5px 7px}
.tbl-scroll{max-height:100%; overflow:auto}
.two-tbl{display:grid; grid-template-columns:1fr; gap:22px}

/* ---------- Chart ---------- */
.chart-box{position:relative; height:100%; width:100%}
.chart-sub{text-align:center; color:var(--navy); font-weight:700; font-size:17px; margin-bottom:6px}
.chart-canvas-wrap{position:relative; height:calc(100% - 30px)}
.chart-fallback{font-size:14px}

/* edit data grid for charts */
.data-editor{position:absolute; right:8px; top:8px; z-index:6; background:#fff;
  border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.18);
  padding:10px; max-height:88%; overflow:auto; display:none; font-size:12px}
.data-editor.show{display:block}
.data-editor table{border-collapse:collapse}
.data-editor td,.data-editor th{border:1px solid var(--line); padding:2px 5px}
.data-editor input{width:78px; border:1px solid var(--line); border-radius:5px; padding:2px 4px; font:inherit}
.data-editor .lblcell{min-width:120px}
.mini-toggle{position:absolute; right:8px; top:8px; z-index:5; display:none}
body.editing .mini-toggle{display:inline-flex}

/* mode indicator in toolbar */
.brand-mode{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;
  background:rgba(255,255,255,.12); color:#cfd3ea; border:1px solid rgba(255,255,255,.14)}
.brand-mode.on{background:rgba(58,210,159,.16); color:#3ad29f; border-color:rgba(58,210,159,.4)}

/* chart type / options controls (edit mode) */
.chart-ctrls{position:absolute; left:8px; top:8px; z-index:6; display:none; gap:6px;
  align-items:center; flex-wrap:wrap; background:rgba(255,255,255,.96); padding:6px 8px;
  border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 22px rgba(0,0,0,.14); font-size:11px}
body.editing .chart-ctrls{display:flex}
.chart-ctrls select{font:inherit; font-size:11px; padding:3px 5px; border:1px solid var(--line); border-radius:6px; background:#fff}
.chart-ctrls label{display:inline-flex; align-items:center; gap:3px; color:var(--navy); font-weight:600; cursor:pointer}
.chart-ctrls label input{margin:0}

/* ---------- Editing affordance ---------- */
body.editing [data-edit]{outline:1px dashed rgba(43,43,116,.35); outline-offset:2px; border-radius:4px}
body.editing [data-edit]:hover{outline-color:var(--red)}
[data-edit]:focus{outline:2px solid var(--red); background:rgba(176,30,57,.06)}
body:not(.editing) [contenteditable]{cursor:default}

/* ---------- Nav arrows ---------- */
.nav-arrow{position:fixed; top:50%; transform:translateY(-50%); z-index:40;
  width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(27,27,82,.85); color:#fff; font-size:22px; display:flex;
  align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.25); transition:.15s}
.nav-arrow:hover{background:var(--red)}
#prev{left:16px} #next{right:16px}

/* ---------- Overview ---------- */
#overview{position:fixed; inset:52px 0 0 0; z-index:45; background:rgba(238,240,246,.98);
  display:none; overflow:auto; padding:24px}
#overview.show{display:block}
.ov-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; max-width:1200px; margin:0 auto}
.ov-card{background:#fff; border-radius:12px; overflow:hidden; cursor:pointer;
  box-shadow:0 8px 24px rgba(20,20,60,.12); border:2px solid transparent; transition:.15s}
.ov-card:hover{transform:translateY(-3px); border-color:var(--navy)}
.ov-thumb{height:120px; background:linear-gradient(135deg,#1b1b52,#2b2b74); color:#fff;
  display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; position:relative}
.ov-thumb .n{position:absolute; top:8px; left:10px; font-size:12px; opacity:.7}
.ov-thumb .tt{font-weight:700; font-size:15px; line-height:1.25}
.ov-card .meta{padding:8px 12px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between}

/* toast */
#toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--navy); color:#fff; padding:10px 18px; border-radius:10px; z-index:60;
  font-size:14px; opacity:0; transition:.25s; pointer-events:none}
#toast.show{opacity:1}

/* ---------- Entrance animations ---------- */
@keyframes aFade{from{opacity:0}to{opacity:1}}
@keyframes aUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes aDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes aLeft{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}
@keyframes aRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes aPop{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes aZoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes aBadge{0%{opacity:0;transform:scale(.35) rotate(-25deg)}60%{transform:scale(1.14) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

/* header / footer / decor */
.slide.animate .deco-corner{animation:aFade .6s both}
.slide.animate .office-tag{animation:aDown .5s both}
.slide.animate .slide-title{animation:aLeft .6s .06s both}
.slide.animate .slide-foot{animation:aFade .7s .25s both}

/* list items + numbered badges (staggered via inline --i) */
.slide.animate .list-item{animation:aUp .55s both; animation-delay:calc(.14s + var(--i,0)*.07s)}
.slide.animate .list-item .badge{animation:aBadge .6s both; animation-delay:calc(.18s + var(--i,0)*.07s)}

/* intro */
.slide.animate .intro-text p{animation:aLeft .6s both; animation-delay:calc(.15s + var(--i,0)*.14s)}
.slide.animate .intro-photo{animation:aRight .7s .2s both}

/* tables */
.slide.animate .tbl-cap{animation:aDown .5s .1s both}
.slide.animate .tbl-scroll table.data,
.slide.animate .two-tbl > div{animation:aUp .55s both; animation-delay:calc(.12s + var(--i,0)*.12s)}
.slide.animate table.data tbody tr{animation:aFade .5s both; animation-delay:calc(.28s + var(--i,0)*.04s)}

/* charts */
.slide.animate .chart-sub{animation:aDown .5s both}
.slide.animate .chart-box{animation:aZoom .6s .12s both}

/* title slide */
.slide.animate .chevrons{animation:aRight .8s both}
.slide.animate .title-inner > *{animation:aLeft .6s both}
.slide.animate .title-inner > *:nth-child(1){animation-delay:.15s}
.slide.animate .title-inner > *:nth-child(2){animation-delay:.28s}
.slide.animate .title-inner > *:nth-child(3){animation-delay:.41s}
.slide.animate .title-inner > *:nth-child(4){animation-delay:.54s}
.slide.animate .title-inner > *:nth-child(5){animation-delay:.67s}
.slide.animate .title-inner > *:nth-child(6){animation-delay:.80s}

/* thanks */
.slide.animate .thanks-big{animation:aPop .8s both}

/* hover micro-interactions */
.list-item{transition:transform .2s ease}
.list-item:hover{transform:translateX(5px)}
.badge{transition:transform .2s ease, box-shadow .2s ease}
.list-item:hover .badge{transform:scale(1.1); box-shadow:0 6px 16px rgba(27,27,82,.45)}
table.data tbody tr{transition:background .15s ease}
table.data tbody tr:not(.total):hover td{background:#eef3ff!important}
table.data tbody tr:not(.total):hover td:first-child{background:#e2eaff!important}
.t-fy{transition:transform .2s ease, box-shadow .2s ease}
.t-fy:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(176,30,57,.4)}

/* respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce){
  .slide{transition:none}
  .slide *{animation:none!important}
}

/* ---------- Fullscreen: hide the toolbar and use the whole screen ---------- */
:fullscreen #toolbar{display:none}
:fullscreen #stageWrap{top:0}
:fullscreen #overview{top:0}
:-webkit-full-screen #toolbar{display:none}
:-webkit-full-screen #stageWrap{top:0}
:-webkit-full-screen #overview{top:0}

/* ---------- Exported stand-alone file: no toolbar, full-screen stage ---------- */
html.exported #toolbar{display:none}
html.exported #stageWrap{top:0}
html.exported #overview{top:0}

/* Floating full-screen button — only shown when the toolbar is hidden (exported file) */
#fsFloat{
  position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:60;
  display:none; align-items:center; gap:6px;
  border:1px solid rgba(255,255,255,.18); background:rgba(20,20,46,.92); backdrop-filter:blur(8px);
  color:#fff; padding:8px 16px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600;
  box-shadow:0 2px 14px rgba(0,0,0,.28); transition:.15s;
}
#fsFloat:hover{background:rgba(40,40,80,.96)}
html.exported #fsFloat{display:inline-flex}
:fullscreen #fsFloat{display:none!important}
:-webkit-full-screen #fsFloat{display:none!important}
@media print{#fsFloat{display:none!important}}

/* ---------- Print ---------- */
@media print{
  .slide *{animation:none!important; opacity:1!important}
  #toolbar,.nav-arrow,#overview,.mini-toggle,.data-editor{display:none!important}
  body{overflow:visible; background:#fff}
  #stageWrap{position:static; height:auto; display:block}
  #stage{transform:none!important; width:100%; height:auto}
  .slide{position:relative; opacity:1!important; pointer-events:auto; page-break-after:always;
    box-shadow:none; border-radius:0; width:100%; height:100vh; margin:0}
}
</style>
</head>
<body>

<div id="toolbar">
  <div class="brand">📊 समिक्षा प्रतिवेदन <small>· आ.व. ०८२/०८३</small></div>
  <span class="brand-mode" id="modePill" title="डाटा भण्डारण अवस्था">…</span>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb-btn tb-save" id="btnSaveDb" title="डाटाबेसमा सेभ गर्नुहोस् (Ctrl+S)">🗄 डाटाबेसमा सेभ</button>
    <button class="tb-btn" id="btnEdit">✏️ सम्पादन</button>
    <button class="tb-btn" id="btnOverview">▦ सबै स्लाइड</button>
    <button class="tb-btn" id="btnFull">⛶ फुलस्क्रिन</button>
    <a class="tb-btn" id="btnAdmin" href="/admin" title="एडमिन प्यानल खोल्नुहोस्" style="display:none;text-decoration:none">🗄 एडमिन</a>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group" id="editTools" style="display:none">
    <button class="tb-btn" id="btnAdd">＋ स्लाइड</button>
    <button class="tb-btn" id="btnDup">⧉ कपी</button>
    <button class="tb-btn" id="btnDel">🗑 हटाउ</button>
    <button class="tb-btn" id="btnMoveL">◀ सार</button>
    <button class="tb-btn" id="btnMoveR">सार ▶</button>
  </div>
  <div class="tb-spacer"></div>
  <div class="tb-group">
    <button class="tb-btn" id="btnExport">⬇ JSON</button>
    <button class="tb-btn" id="btnImport">⬆ आयात</button>
    <button class="tb-btn" id="btnSaveHtml">💾 HTML</button>
    <button class="tb-btn" id="btnPrint">🖨 PDF</button>
    <button class="tb-btn" id="btnReset">↺ रिसेट</button>
  </div>
  <input type="file" id="fileInput" accept="application/json" style="display:none">
</div>

<button id="fsFloat" title="फुलस्क्रिन">⛶ फुलस्क्रिन</button>

<button class="nav-arrow" id="prev">‹</button>
<button class="nav-arrow" id="next">›</button>

<div id="stageWrap">
  <div id="stage"></div>
</div>

<div id="overview"><div class="ov-grid" id="ovGrid"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   DECK DATA MODEL  —  edit here to change content directly,
   or use the on-screen ✏️ सम्पादन (Edit) mode.
   ============================================================ */
const ORIGINAL_DECK = {
  meta:{
    province:"गण्डकी प्रदेश",
    ministry:"भौतिक पूर्वाधार तथा यातायात व्यवस्था मन्त्रालय",
    office:"यातायात व्यवस्था कार्यालय, नवलपरासी (ब.सु.पू.)",
    officeFull:"यातायात व्यवस्था कार्यालय, नवलपरासी (बर्दघाट सुस्तापूर्व)",
    fy:"आ.व. ०८२/०८३",
    reportTitle:"बार्षिक समिक्षा प्रतिवेदन"
  },
  slides:[
    { type:"title" },

    { type:"intro", title:"कार्यालय परिचय",
      paras:[

        "यस कार्यालयबाट हालसम्म विशेषत नवलपरासी (ब.सु.पू.) जिल्लाबासीहरू लाभान्वित भएका छन् । गण्डकी प्रदेशका विभिन्न जिल्लामा स्थायी बसोबास भई हाल रुपन्देही एवं चितवन जिल्लामा रहेका सेवाग्राहीले समेत सेवा पाइरहेको अवस्था छ ।"

/* ============================================================
   APP
   ============================================================ */
const PALETTE = ['#2f6bff','#ec4899','#38bdf8','#a855f7','#f59e0b','#10b981','#ef4444'];
const LS_KEY = 'annualReviewDeck_v1';
let DECK = {meta:{},slides:[]};
let cur = 0;
let editing = false;
const chartInstances = {};

/* ---------- Persistence layer ----------
   SERVER mode  : deck is loaded from and saved to the Flask/SQLite API.
   Offline mode : (opened as a bare file, no backend) falls back to
   localStorage + the embedded ORIGINAL_DECK, so the deck still works stand-alone. */
let SERVER = false;
const dirty = { meta:false, slides:new Set() };

async function api(method, url, body){
  const res = await fetch(url, {
    method,
    headers: body!==undefined ? {'Content-Type':'application/json'} : undefined,
    body: body!==undefined ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error(method+' '+url+' → '+res.status);
  return res.status===204 ? null : res.json();
}

async function bootstrap(){
  try{
    DECK = await api('GET','/api/deck');
    if(!DECK || !Array.isArray(DECK.slides)) throw new Error('bad deck');
    SERVER = true;
  }catch(e){
    SERVER = false;
    DECK = load();
  }
  render(); show(0);
  document.getElementById('modePill').textContent = SERVER ? '● सर्भर' : '○ अफलाइन';
  document.getElementById('modePill').className = 'brand-mode'+(SERVER?' on':'');
  document.getElementById('btnSaveDb').title = SERVER
    ? 'डाटाबेसमा सेभ गर्नुहोस् (Ctrl+S)'
    : 'यसै ब्राउजरमा सेभ गर्नुहोस् — सर्भर चलेको छैन (Ctrl+S)';
  document.getElementById('btnAdmin').style.display = SERVER ? 'inline-flex' : 'none';
  setSaveUI('saved');
}

function load(){
  try{ const s = localStorage.getItem(LS_KEY); if(s) return JSON.parse(s); }catch(e){}
  return structuredClone(ORIGINAL_DECK);
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DECK)); }catch(e){} }

// Reload the whole deck from the server after a structural change (keeps ids/order in sync).
async function reloadDeck(){ DECK = await api('GET','/api/deck'); render(); }

// Mark which entity a path-based text edit touched, so we only PUT what changed.
function markDirty(path){
  if(path.startsWith('meta.')) dirty.meta = true;
  else { const m = path.match(/^slides\.(\d+)(?:\.|$)/); if(m) dirty.slides.add(+m[1]); }
}
function slidePayload(sl){ const {_id, ...rest} = sl; return rest; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ce(path){ return `contenteditable="false" data-edit="${path}"`; }

/* ---------- Render ---------- */
const stage = document.getElementById('stage');

function render(){
  // destroy charts
  Object.values(chartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  for(const k in chartInstances) delete chartInstances[k];
  stage.innerHTML='';
  DECK.slides.forEach((sl,i)=>{
    const el = document.createElement('section');
    el.className='slide'+(i===cur?' active':'');
    el.dataset.index=i;
    el.innerHTML = renderSlide(sl,i);
    stage.appendChild(el);
  });
  applyEditing();
  fit();
  ensureChart(cur);
  updateArrows();
  animateSlide(cur);
}

// (Re)trigger the entrance animations on the active slide. Only the active
// slide carries the `animate` class; removing + reflowing + re-adding it
// restarts the CSS animations so they replay on every navigation.
function animateSlide(i){
  const kids=stage.children;
  for(const el of kids) el.classList.remove('animate');
  const el=kids[i];
  if(!el) return;
  void el.offsetWidth; // force reflow so the animations restart
  el.classList.add('animate');
}

// Lazily build only the active slide's chart to avoid many simultaneous
// resize-observers inside the scaled stage (which can peg the renderer).
function ensureChart(i){
  const sl=DECK.slides[i];
  if(sl && sl.chart && !chartInstances[i]) buildChart(i,sl);
}

function frame(inner, sl, i){
  const m=DECK.meta;
  return `
    <div class="deco-corner"></div>
    <div class="slide-head">
      <div class="office-tag" ${ce('meta.officeFull')}>${esc(m.officeFull)}</div>
      <h2 class="slide-title" ${ce('slides.'+i+'.title')}>${esc(sl.title||'')}${sl.chart&&sl.chart.sub?'':''}</h2>
    </div>
    <div class="slide-body">${inner}</div>
    <div class="slide-foot">
      <div class="bar"></div>
      <div class="fname">${esc(m.officeFull)}</div>
      <div class="pnum">${i+1} / ${DECK.slides.length}</div>
    </div>`;
}

function renderSlide(sl,i){
  switch(sl.type){
    case 'title': return renderTitle(i);
    case 'intro': return frame(renderIntro(sl,i),sl,i);
    case 'list': return frame(renderList(sl,i),sl,i);
    case 'table': return frame(renderTableSlide(sl,i),sl,i);
    case 'twotable': return frame(renderTwoTable(sl,i),sl,i);
    case 'chart': return frame(renderChartSlide(sl,i),sl,i);
    case 'thanks': return renderThanks(sl,i);
    default: return frame('<div>?</div>',sl,i);
  }
}

function renderThanks(sl,i){
  const m=DECK.meta;
  return `
  <div class="deco-corner"></div>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#fff 60%,#eef1ff)">
    <div class="thanks-big" style="font-size:96px;font-weight:800;color:var(--navy)" ${ce('slides.'+i+'.text')}>${esc(sl.text)}</div>
  </div>
  <div class="slide-foot"><div class="bar"></div><div class="fname">${esc(m.officeFull)}</div><div class="pnum">${i+1} / ${DECK.slides.length}</div></div>`;
}

function renderIntro(sl,i){
  const paras = sl.paras.map((p,pi)=>`<p style="--i:${pi}" ${ce('slides.'+i+'.paras.'+pi)}>${esc(p)}</p>`).join('');
  return `<div class="intro-wrap">
    <div class="intro-text">${paras}</div>
    <div class="intro-photo">
      <img class="intro-photo-img" src="${esc(sl.photo||'office.jpg')}" alt=""
        onerror="if(this.dataset.f){this.remove()}else{this.dataset.f=1;this.src='office.png'}">
      <span ${ce('slides.'+i+'.photoText')}>${esc(sl.photoText||'')}</span>
    </div>
  </div>`;
}

function renderList(sl,i){
  const start = sl.startNo||1;
  const items = sl.items.map((t,ii)=>`
    <div class="list-item" style="--i:${ii}">
      <div class="badge">${pad(start+ii)}</div>
      <div class="txt" ${ce('slides.'+i+'.items.'+ii)}>${esc(t)}</div>
    </div>`).join('');
  return `<div class="list-grid ${sl.cols===2?'cols-2':''} ${sl.big?'big':''}">${items}</div>`;
}
function pad(n){ return n<10?('0'+n):(''+n); }

function tableHTML(tbl, pathPrefix, opts={}){
  const compact = opts.compact?' compact':'';
  let thead='';
  (tbl.head||[]).forEach((row,ri)=>{
    thead += '<tr>'+row.map((c,ci)=>{
      const cs=c.cs?` colspan="${c.cs}"`:''; const rs=c.rs?` rowspan="${c.rs}"`:'';
      const g2=c.g2?' g2':'';
      return `<th class="hc${g2}"${cs}${rs} ${ce(pathPrefix+'.head.'+ri+'.'+ci+'.t')}>${esc(c.t)}</th>`;
    }).join('')+'</tr>';
  });
  let tbody='';
  (tbl.rows||[]).forEach((r,ri)=>{
    const isTotal = opts.totalRow && (ri===tbl.rows.length-1) && !opts.noTotalHighlight;
    tbody += `<tr class="${isTotal?'total':''}" style="--i:${ri}">`+r.map((v,ci)=>
      `<td ${ce(pathPrefix+'.rows.'+ri+'.'+ci)}>${esc(v)}</td>`).join('')+'</tr>';
  });
  return `<table class="data${compact}"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
}

function renderTableSlide(sl,i){
  const cap = sl.caption?`<div class="tbl-cap" ${ce('slides.'+i+'.caption')}>${esc(sl.caption)}</div>`:'';
  const hasChart = !!sl.chart;
  const tbl = tableHTML(sl,'slides.'+i,{compact:sl.compact,totalRow:sl.totalRow});
  if(hasChart){
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;height:100%">
      <div class="tbl-scroll">${cap}${tbl}</div>
      <div class="chart-box">${chartBoxHTML(i,sl)}</div>
    </div>`;
  }
  return `<div class="tbl-scroll">${cap}${tbl}</div>`;
}

function renderTwoTable(sl,i){
  const t = sl.tables.map((tb,ti)=>`<div style="--i:${ti}">${tableHTML(tb,'slides.'+i+'.tables.'+ti,{})}</div>`).join('');
  return `<div class="two-tbl">${t}</div>`;
}

function renderChartSlide(sl,i){
  const sub = sl.chart.sub?`<div class="chart-sub" ${ce('slides.'+i+'.chart.sub')}>${esc(sl.chart.sub)}</div>`:'';
  return `<div class="chart-box">${sub}${chartBoxHTML(i,sl)}</div>`;
}

const CHART_TYPES = [
  ['bar','📊 बार'],['line','📈 रेखा'],['area','🏔 क्षेत्र'],
  ['radar','🕸 रडार'],['doughnut','🍩 डोनट'],['pie','🥧 पाई'],['polarArea','🎯 पोलर']
];
function chartCtrlsHTML(i,c){
  const t=c.type||'bar';
  const opts=CHART_TYPES.map(([v,l])=>`<option value="${v}"${v===t?' selected':''}>${l}</option>`).join('');
  const ck=(k)=> c[k]?' checked':'';
  return `<div class="chart-ctrls" data-i="${i}">
    <select data-cc="type" data-i="${i}" title="चार्ट प्रकार">${opts}</select>
    <label title="स्ट्याक्ड"><input type="checkbox" data-cc="stacked" data-i="${i}"${ck('stacked')}>स्ट्याक</label>
    <label title="तेर्सो बार"><input type="checkbox" data-cc="horizontal" data-i="${i}"${ck('horizontal')}>तेर्सो</label>
    <label title="मान लेबल"><input type="checkbox" data-cc="datalabels" data-i="${i}"${ck('datalabels')}>लेबल</label>
  </div>`;
}
function chartBoxHTML(i,sl){
  const canId='chart_'+i;
  return `
    ${chartCtrlsHTML(i,sl.chart)}
    <button class="tb-btn mini-toggle" data-datatoggle="${i}" style="background:var(--navy)">✎ डाटा</button>
    <div class="chart-canvas-wrap"><canvas id="${canId}"></canvas>
      <div class="chart-fallback" id="fb_${i}" style="display:none"></div>
    </div>
    <div class="data-editor" id="de_${i}">${dataEditorHTML(i,sl.chart)}</div>`;
}

function dataEditorHTML(i,chart){
  let h='<table><thead><tr><th></th>'+chart.labels.map((l,li)=>
    `<th><input data-de="${i}" data-kind="label" data-li="${li}" value="${esc(l)}"></th>`).join('')+'</tr></thead><tbody>';
  chart.datasets.forEach((ds,di)=>{
    h+='<tr><td class="lblcell"><input data-de="${i}" data-kind="dslabel" data-di="'+di+'" value="'+esc(ds.label)+'"></td>'+
      ds.data.map((v,vi)=>`<td><input data-de="${i}" data-kind="val" data-di="${di}" data-vi="${vi}" value="${esc(v)}"></td>`).join('')+'</tr>';
  });
  h+='</tbody></table>';
  return h.replace(/data-de="\$\{i\}"/g,'data-de="'+i+'"');
}

// register the datalabels plugin once, but keep it OFF by default (opt-in per chart)
let DL_REGISTERED=false;
function ensureDatalabels(){
  if(!DL_REGISTERED && typeof Chart!=='undefined' && window.ChartDataLabels){
    Chart.register(window.ChartDataLabels); Chart.defaults.set('plugins.datalabels',{display:false});
    DL_REGISTERED=true;
  }
}
// vertical gradient fill built lazily once Chart.js has laid out the plot area
function vGradient(ctx,area,hex,a1,a2){
  const g=ctx.createLinearGradient(0,area.top,0,area.bottom);
  g.addColorStop(0,hexA(hex,a1)); g.addColorStop(1,hexA(hex,a2)); return g;
}

function buildChart(i,sl){
  if(chartInstances[i]) return;
  ensureDatalabels();
  const c = sl.chart; const canvas = document.getElementById('chart_'+i);
  if(!canvas) return;
  if(typeof Chart==='undefined'){
    const fb=document.getElementById('fb_'+i);
    if(fb){ fb.style.display='block'; fb.innerHTML = fallbackTable(c); canvas.style.display='none'; }
    return;
  }
  const baseType = c.type||'bar';
  const pieLike  = ['doughnut','pie','polarArea'].includes(baseType);
  const isRadial = pieLike || baseType==='radar';
  const renderType = baseType==='area' ? 'line' : baseType;   // area = filled line
  const horizontal = !!c.horizontal && !isRadial;
  const stacked = !!c.stacked && !isRadial;
  const singlePie = pieLike && c.datasets.length===1;

  const datasets = c.datasets.map((ds,di)=>{
    const col = PALETTE[di%PALETTE.length];
    const dsType = ds.type;                       // per-dataset override => mixed charts
    const asLine = (dsType||renderType)==='line';
    const filled = baseType==='area' || ds.fill===true;
    const base = {
      label: ds.label, data: ds.data.map(Number), type: dsType||undefined,
      borderColor: singlePie ? '#fff' : col,
      borderWidth: singlePie ? 2 : (asLine?3:1.5),
      tension:.35, pointRadius: asLine?3:0, pointHoverRadius:6, pointBackgroundColor:col,
      borderRadius: (dsType||renderType)==='bar'?6:0, borderSkipped:false,
      fill: isRadial ? (baseType==='radar') : (asLine ? filled : true),
      backgroundColor:(context)=>{
        const {ctx,chartArea}=context.chart;
        if(pieLike) return singlePie ? c.labels.map((_,k)=>hexA(PALETTE[k%PALETTE.length],.85)) : hexA(col,.55);
        if(baseType==='radar') return hexA(col,.18);
        if(!chartArea) return hexA(col, asLine?.15:.7);
        return asLine ? vGradient(ctx,chartArea,col,.38,0) : vGradient(ctx,chartArea,col,.95,.5);
      }
    };
    if(c.dualAxis && ds.axis==='y1' && !isRadial) base.yAxisID='y1';
    return base;
  });

  const options = { responsive:true, maintainAspectRatio:false,
    animation:{duration:900, easing:'easeOutQuart'},
    interaction: isRadial?{mode:'nearest'}:{mode:'index',intersect:false},
    plugins:{
      legend:{ position: isRadial?'right':'top', labels:{font:{size:12},boxWidth:14,usePointStyle:true} },
      tooltip:{ callbacks:{ label:ctx=>{
        const v = ctx.parsed?.y ?? ctx.parsed?.r ?? ctx.parsed;
        return (ctx.dataset.label?ctx.dataset.label+': ':'')+Number(v).toLocaleString();
      }}},
      datalabels: c.datalabels ? {
        display: (ctx)=> pieLike ? true : ctx.dataset.data[ctx.dataIndex] > 0,
        color: pieLike?'#fff':'#1b1b52', font:{size:10,weight:'700'},
        anchor: pieLike?'center':'end', align: pieLike?'center':'end',
        formatter:v=>fmt(v)
      } : {display:false}
    }
  };
  if(!isRadial){
    options.indexAxis = horizontal?'y':'x';
    options.scales = {
      x:{ stacked, ticks:{font:{size:11}}, grid:{color:'rgba(20,20,60,.06)'} },
      y:{ stacked, beginAtZero:true, ticks:{font:{size:11},callback:v=>fmt(v)}, grid:{color:'rgba(20,20,60,.06)'} }
    };
    if(c.dualAxis){
      options.scales.y.position='left'; options.scales.y.title={display:true,text:'अन्य'};
      options.scales.y1={ position:'right', beginAtZero:true, grid:{drawOnChartArea:false},
        ticks:{font:{size:11},callback:v=>fmt(v)}, title:{display:true,text:'मुख्य'} };
    }
  } else if(baseType==='radar'){
    options.scales={ r:{ ticks:{callback:v=>fmt(v),backdropColor:'transparent',font:{size:9}}, pointLabels:{font:{size:11}} } };
  }

  chartInstances[i] = new Chart(canvas.getContext('2d'), {
    type: renderType,
    data:{ labels:c.labels.slice(), datasets },
    options
  });
}
function fallbackTable(c){
  let h='<table class="data compact"><thead><tr><th>—</th>'+c.labels.map(l=>`<th>${esc(l)}</th>`).join('')+'</tr></thead><tbody>';
  c.datasets.forEach(ds=>{ h+='<tr><td>'+esc(ds.label)+'</td>'+ds.data.map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>'; });
  return h+'</tbody></table><p style="color:#888">(चार्ट लोड हुन इन्टरनेट चाहिन्छ — डाटा माथि देखाइएको छ)</p>';
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function fmt(v){ v=Number(v); if(Math.abs(v)>=1e6) return (v/1e6).toFixed(1)+'M'; if(Math.abs(v)>=1e3) return (v/1e3).toFixed(0)+'K'; return v; }

/* ---------- Fit / scale ---------- */
function fit(){
  const wrap=document.getElementById('stageWrap');
  const pad=32;
  const sw=wrap.clientWidth-pad, sh=wrap.clientHeight-pad;
  const scale=Math.min(sw/1280, sh/720);
  stage.style.transform='scale('+scale+')';
}
window.addEventListener('resize', fit);

/* ---------- Navigation ---------- */
function show(idx){
  cur=Math.max(0,Math.min(DECK.slides.length-1,idx));
  [...stage.children].forEach((el,i)=> el.classList.toggle('active', i===cur));
  ensureChart(cur);
  updateArrows();
  animateSlide(cur);
}
function updateArrows(){
  document.getElementById('prev').style.visibility = cur>0?'visible':'hidden';
  document.getElementById('next').style.visibility = cur<DECK.slides.length-1?'visible':'hidden';
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveAllToDB(); return; }
  if(e.target.matches('[contenteditable="true"],input,textarea')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1);}
  else if(e.key==='Home'){show(0);} else if(e.key==='End'){show(DECK.slides.length-1);}
  else if(e.key.toLowerCase()==='o'){toggleOverview();}
  else if(e.key.toLowerCase()==='e'){toggleEdit();}
  else if(e.key==='Escape'){document.getElementById('overview').classList.remove('show');}
});

/* ---------- Editing ---------- */
function applyEditing(){
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.setAttribute('contenteditable', editing?'true':'false');
  });
  document.body.classList.toggle('editing', editing);
}
function toggleEdit(){
  editing=!editing;
  document.getElementById('btnEdit').classList.toggle('active',editing);
  document.getElementById('editTools').style.display=editing?'flex':'none';
  applyEditing();
  toast(editing?'सम्पादन मोड चालु — कुनै पनि टेक्स्टमा क्लिक गरी परिवर्तन गर्नुहोस्':'सम्पादन मोड बन्द');
}
document.getElementById('btnEdit').onclick=toggleEdit;

// text edits -> model
stage.addEventListener('input', e=>{
  const el=e.target.closest('[data-edit]'); if(!el) return;
  setByPath(DECK, el.dataset.edit, coerce(el.textContent, el.dataset.edit));
  markDirty(el.dataset.edit);
  scheduleSave();
});
// chart data editor
stage.addEventListener('input', e=>{
  const inp=e.target.closest('input[data-de]'); if(!inp) return;
  const i=+inp.dataset.de; const chart=DECK.slides[i].chart;
  const kind=inp.dataset.kind;
  if(kind==='label') chart.labels[+inp.dataset.li]=inp.value;
  else if(kind==='dslabel') chart.datasets[+inp.dataset.di].label=inp.value;
  else if(kind==='val') chart.datasets[+inp.dataset.di].data[+inp.dataset.vi]=parseFloat(inp.value)||0;
  // live update chart
  const ci=chartInstances[i];
  if(ci){ ci.data.labels=chart.labels.slice();
    chart.datasets.forEach((ds,di)=>{ if(ci.data.datasets[di]){ci.data.datasets[di].label=ds.label; ci.data.datasets[di].data=ds.data.map(Number);}});
    ci.update();
  }
  dirty.slides.add(i);
  scheduleSave();
});
stage.addEventListener('click', e=>{
  const b=e.target.closest('[data-datatoggle]'); if(!b) return;
  document.getElementById('de_'+b.dataset.datatoggle).classList.toggle('show');
});
// chart type / options controls -> update config + rebuild chart
stage.addEventListener('change', e=>{
  const el=e.target.closest('[data-cc]'); if(!el) return;
  const i=+el.dataset.i; const chart=DECK.slides[i] && DECK.slides[i].chart; if(!chart) return;
  const key=el.dataset.cc;
  chart[key] = (el.type==='checkbox') ? el.checked : el.value;
  if(chartInstances[i]){ try{chartInstances[i].destroy()}catch(_){} delete chartInstances[i]; }
  buildChart(i,DECK.slides[i]);
  dirty.slides.add(i); scheduleSave();
});

function coerce(text, path){
  const t=text.trim();
  // keep numeric cells numeric where original was number
  const orig = getByPath(ORIGINAL_DECK, path);
  if(typeof orig==='number' && t!=='' && !isNaN(t.replace(/,/g,''))) return parseFloat(t.replace(/,/g,''));
  return text;
}
function getByPath(o,p){ return p.split('.').reduce((a,k)=> a==null?a:a[k], o); }
function setByPath(o,p,v){ const ks=p.split('.'); let x=o; for(let i=0;i<ks.length-1;i++) x=x[ks[i]]; x[ks[ks.length-1]]=v; }

let saveT=null;
function scheduleSave(){ clearTimeout(saveT); saveT=setTimeout(flushSave,450); setSaveUI('unsaved'); }

// Reflect save status on the toolbar button: 'saved' | 'unsaved' | 'saving'.
function setSaveUI(state){
  const b=document.getElementById('btnSaveDb'); if(!b) return;
  b.classList.toggle('unsaved', state==='unsaved');
  b.classList.toggle('saving', state==='saving');
  if(state==='saving') b.textContent='⏳ सेभ हुँदै…';
  else if(state==='unsaved') b.textContent='🗄 सेभ गर्नुहोस् •';
  else b.textContent='✔ सेभ भयो';
}

// Persist any pending edits immediately. Awaited before every structural
// change (add/duplicate/delete/move) and deck reload, so a debounced text or
// chart edit is never clobbered by the deck being re-fetched from the server.
async function flushSave(){
  clearTimeout(saveT); saveT=null;
  if(!SERVER){ save(); setSaveUI('saved'); return; }
  if(!dirty.meta && dirty.slides.size===0){ setSaveUI('saved'); return; }
  const jobs=[];
  if(dirty.meta){ dirty.meta=false; jobs.push(api('PUT','/api/meta',DECK.meta)); }
  const idx=[...dirty.slides]; dirty.slides.clear();
  for(const i of idx){
    const sl=DECK.slides[i];
    if(sl && sl._id!=null) jobs.push(api('PUT','/api/slides/'+sl._id, slidePayload(sl)));
  }
  try{ await Promise.all(jobs); setSaveUI('saved'); }
  catch(e){ toast('⚠ सर्भरमा सेभ हुन सकेन'); setSaveUI('unsaved'); }
}

// Explicit "Save to database" action: force-commits the whole current deck
// (all slides + meta), independent of the debounced autosave.
async function saveAllToDB(){
  const b=document.getElementById('btnSaveDb');
  if(b && b.classList.contains('saving')) return;      // avoid double clicks
  if(!SERVER){ save(); setSaveUI('saved'); toast('✔ सेभ भयो (अफलाइन — यसै ब्राउजरमा)'); return; }
  setSaveUI('saving');
  try{
    clearTimeout(saveT); saveT=null;
    // one atomic request saves the whole deck (meta + all slides, in order).
    // Send slides WITH their _id so the server upserts by id (preserves ids)
    // instead of deleting + recreating everything.
    const fresh = await api('PUT','/api/deck', {meta:DECK.meta, slides:DECK.slides});
    // sync ids back (same order) without a disruptive re-render/animation replay
    fresh.slides.forEach((s,i)=>{ if(DECK.slides[i]) DECK.slides[i]._id = s._id; });
    dirty.meta=false; dirty.slides.clear();
    setSaveUI('saved'); toast('✔ डाटाबेसमा सेभ भयो ('+DECK.slides.length+' स्लाइड)');
  }catch(e){ setSaveUI('unsaved'); toast('⚠ डाटाबेसमा सेभ हुन सकेन'); }
}
document.getElementById('btnSaveDb').onclick=saveAllToDB;

// Last-ditch save when the page is hidden/closed/reloaded within the debounce
// window; keepalive lets these requests outlive the page.
function flushOnExit(){
  if(!SERVER){ save(); return; }
  const send=(url,body)=>fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body), keepalive:true}).catch(()=>{});
  if(dirty.meta) send('/api/meta',DECK.meta);
  for(const i of dirty.slides){ const sl=DECK.slides[i]; if(sl && sl._id!=null) send('/api/slides/'+sl._id, slidePayload(sl)); }
}
window.addEventListener('pagehide', flushOnExit);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushOnExit(); });

/* slide ops (server-aware; falls back to localStorage when offline) */
async function persistOrder(){
  if(SERVER) await api('POST','/api/slides/reorder',{order:DECK.slides.map(s=>s._id)});
  else save();
}
document.getElementById('btnAdd').onclick=async ()=>{
  await flushSave();
  const s={type:'list',title:'नयाँ स्लाइड',cols:1,big:true,items:['नयाँ बुँदा']};
  if(SERVER){ await api('POST','/api/slides',{after:DECK.slides[cur]?._id ?? null, slide:s}); await reloadDeck(); show(Math.min(cur+1,DECK.slides.length-1)); }
  else { DECK.slides.splice(cur+1,0,s); save(); render(); show(cur+1); }
  toast('स्लाइड थपियो');
};
document.getElementById('btnDup').onclick=async ()=>{
  await flushSave();
  if(SERVER){ const id=DECK.slides[cur]?._id; if(id==null) return; await api('POST','/api/slides/'+id+'/duplicate'); await reloadDeck(); show(cur+1); }
  else { DECK.slides.splice(cur+1,0,structuredClone(DECK.slides[cur])); save(); render(); show(cur+1); }
  toast('स्लाइड कपी भयो');
};
document.getElementById('btnDel').onclick=async ()=>{
  if(DECK.slides.length<=1) return;
  if(!confirm('यो स्लाइड हटाउने?')) return;
  await flushSave();
  if(SERVER){ const id=DECK.slides[cur]?._id; await api('DELETE','/api/slides/'+id); await reloadDeck(); if(cur>=DECK.slides.length) cur=DECK.slides.length-1; show(cur); }
  else { DECK.slides.splice(cur,1); if(cur>=DECK.slides.length) cur=DECK.slides.length-1; save(); render(); show(cur); }
  toast('स्लाइड हटाइयो');
};
document.getElementById('btnMoveL').onclick=async ()=>{ if(cur===0)return; await flushSave(); [DECK.slides[cur-1],DECK.slides[cur]]=[DECK.slides[cur],DECK.slides[cur-1]]; await persistOrder(); render(); show(cur-1); };
document.getElementById('btnMoveR').onclick=async ()=>{ if(cur===DECK.slides.length-1)return; await flushSave(); [DECK.slides[cur+1],DECK.slides[cur]]=[DECK.slides[cur],DECK.slides[cur+1]]; await persistOrder(); render(); show(cur+1); };

/* ---------- Overview ---------- */
function toggleOverview(){ const ov=document.getElementById('overview'); ov.classList.toggle('show'); if(ov.classList.contains('show')) buildOverview(); }
document.getElementById('btnOverview').onclick=toggleOverview;
function buildOverview(){
  const g=document.getElementById('ovGrid'); g.innerHTML='';
  DECK.slides.forEach((sl,i)=>{
    const title = sl.title || (sl.type==='title'?DECK.meta.reportTitle:(sl.type==='thanks'?sl.text:'—'));
    const card=document.createElement('div'); card.className='ov-card';
    card.innerHTML=`<div class="ov-thumb"><span class="n">${i+1}</span><span class="tt">${esc(title)}</span></div>
      <div class="meta"><span>${typeLabel(sl.type)}</span><span>#${i+1}</span></div>`;
    card.onclick=()=>{ show(i); document.getElementById('overview').classList.remove('show'); };
    g.appendChild(card);
  });
}
function typeLabel(t){ return {title:'शीर्षक',intro:'परिचय',list:'सूची',table:'तालिका',twotable:'तालिका',chart:'चार्ट',thanks:'धन्यवाद'}[t]||t; }

/* ---------- Fullscreen ---------- */
const toggleFull=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
document.getElementById('btnFull').onclick=toggleFull;
document.getElementById('fsFloat').onclick=toggleFull;
// re-fit the stage when the toolbar shows/hides on fullscreen toggle
document.addEventListener('fullscreenchange', ()=>setTimeout(fit,60));
document.addEventListener('webkitfullscreenchange', ()=>setTimeout(fit,60));

/* ---------- Export / Import / Save HTML / Print / Reset ---------- */
// strip server-only ids so the exported/baked deck is clean JSON
function cleanDeck(){ return JSON.parse(JSON.stringify(DECK, (k,v)=> k==='_id'?undefined:v)); }
document.getElementById('btnExport').onclick=()=>{
  downloadBlob(JSON.stringify(cleanDeck(),null,2),'presentation-data.json','application/json'); toast('JSON निर्यात भयो');
};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=async ()=>{ try{
    const data=JSON.parse(r.result);
    if(SERVER){ await api('POST','/api/import',data); await reloadDeck(); }
    else { DECK=data; save(); render(); }
    cur=0; show(0); toast('आयात सफल');
  }catch(err){ alert('अमान्य JSON फाइल'); } };
  r.readAsText(f); e.target.value='';
};
document.getElementById('btnSaveHtml').onclick=()=>{
  // embed the current deck as the new original so the exported stand-alone file
  // opens with edits baked in even without the backend. The `exported` class
  // hides the toolbar and lets the stage use the whole screen in the saved file.
  document.documentElement.classList.add('exported');
  const html=document.documentElement.outerHTML.replace(
    /const ORIGINAL_DECK = \{[\s\S]*?\n  \]\n\};/,
    'const ORIGINAL_DECK = '+JSON.stringify(cleanDeck())+';'
  ).replace(/const LS_KEY = 'annualReviewDeck_v1';/, "const LS_KEY = 'annualReviewDeck_export_"+Date.now()+"';");
  document.documentElement.classList.remove('exported');
  downloadBlob('<!DOCTYPE html>\n'+html,'presentation.html','text/html');
  toast('HTML फाइल डाउनलोड भयो');
};
document.getElementById('btnPrint').onclick=()=>{
  // ensure every chart is rendered so it appears in the printed PDF
  DECK.slides.forEach((sl,i)=>{ if(sl.chart) buildChart(i,sl); });
  setTimeout(()=>window.print(), 400);
};
document.getElementById('btnReset').onclick=async ()=>{
  if(!confirm('मूल सामग्रीमा फर्काउने? सबै परिवर्तन हट्नेछन्।')) return;
  if(SERVER){ await api('POST','/api/reset'); await reloadDeck(); }
  else { DECK=structuredClone(ORIGINAL_DECK); save(); render(); }
  cur=0; show(0); toast('रिसेट भयो');
};
function downloadBlob(content,name,type){
  const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ---------- Toast ---------- */
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- init ---------- */
bootstrap();
window.addEventListener('load', fit);
setTimeout(fit,300);
</script>
